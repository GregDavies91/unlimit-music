<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Guitar Chords &amp; Root Notes — Play &amp; Learn</title>
  <meta name="description" content="Tap a root note to hear it, then tap a chord to hear and see how to play it on guitar. Free guitar chord charts, audio, and a chromatic scales wheel for songwriters." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" />
  <meta name="google-adsense-account" content="ca-pub-1921965753258324" />

  <!-- Google Consent Mode v2: default DENIED for EU/GB/CH, granted elsewhere.
       The certified CMP below updates this after the visitor decides. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      region: ['EU', 'GB', 'CH']
    });
  </script>
  <!-- Google-certified CMP (Funding Choices). IMPORTANT: enable the consent
       message in AdSense -> Privacy & messaging first, otherwise this shows nothing. -->
  <script async src="https://fundingchoicesmessages.google.com/i/ca-pub-1921965753258324?ship=0"></script>
  <!-- AdSense loader. Gated by Consent Mode — no ad cookies until consent is set. -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1921965753258324" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app">
    <!-- left fixed rainbow root column -->
    <nav class="roots" aria-label="Root notes">
      <div id="rootRow" class="root-col"></div>
    </nav>

    <!-- right: top bar + middle row (diagrams | scales wheel) + chord grid -->
    <main class="stage">
      <!-- top bar: Settings (left) · ad (centre) · Scale (right) -->
      <header class="topbar">
        <button id="settingsBtn" class="topbtn" aria-haspopup="true">Settings</button>
        <div id="ad-slot" class="ad-slot" aria-label="Advertisement"></div>
        <button id="scaleBtn" class="topbtn" aria-haspopup="true">Scale</button>

        <!-- Scale picker popover (top-right, below the bar) -->
        <div id="scalePanel" class="panel" role="menu" aria-label="Choose a scale"></div>

        <!-- Settings popover (top-left, below the bar) -->
        <div id="settingsPanel" class="panel" role="dialog" aria-label="Settings">
          <label class="setting-row">
            <input type="checkbox" id="followChordsToggle" />
            <span>Scales wheel follows the chord root</span>
          </label>
          <p class="setting-note">Off by default. When on, the wheel's top note
            tracks the root you pick on the left and you can't spin it manually.</p>
        </div>
      </header>

      <!-- middle: guitar diagram (+ future piano slot) on the left, wheel on the right -->
      <div class="stage-mid">
        <section class="diagrams">
          <div class="diagram-box" aria-label="Chord diagram">
            <div class="diagram-stage">
              <img id="diagramImg" alt="Guitar chord diagram" />
            </div>
          </div>
          <!-- FUTURE: piano chord diagram toggled from Settings. Space reserved. -->
          <div class="piano-slot" aria-hidden="true"></div>
        </section>

        <section class="scales-box" aria-label="Scales wheel">
          <div id="scalesWheel" class="scales-wheel"></div>
          <div id="scalesCaption" class="scales-caption">Chromatic</div>
        </section>
      </div>

      <section class="chords" aria-label="Chords in this key">
        <div id="chordRow" class="chord-grid"></div>
      </section>
    </main>
  </div>

  <!-- popup toast for placeholder buttons -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- first-load instruction pointing at the root column (on the LEFT) -->
  <div id="onboard" class="onboard">
    <div class="onboard-arrow" aria-hidden="true">&#11013;</div>
    <div class="onboard-card">
      <h2>Start here</h2>
      <p>Tap a <b>root note</b> on the left to hear it, then tap any chord to hear and see how to play it.</p>
      <button id="onboardOk" class="onboard-ok">Got it</button>
    </div>
  </div>

  <footer class="site-footer">
    <a href="privacy.html">Privacy Policy</a>
    <span aria-hidden="true">·</span>
    <a href="https://www.google.com/settings/ads" rel="noopener" target="_blank">Ad Settings</a>
  </footer>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="scales.js"></script>
  <script src="app.js"></script>
  <script src="consent-ads.js"></script>
</body>
</html>
